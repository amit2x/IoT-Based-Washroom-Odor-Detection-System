
x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Clustered EMQX MQTT Brokers
  emqx1:
    image: emqx:5.8
    container_name: emqx1
    hostname: emqx1.iot-network
    restart: unless-stopped
    environment:
      - EMQX_NODE__NAME=emqx1@emqx1.iot-network
      - EMQX_NODE__COOKIE=${EMQX_NODE_COOKIE}
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_CLUSTER__STATIC__SEEDS=[emqx1@emqx1.iot-network,emqx2@emqx2.iot-network,emqx3@emqx3.iot-network]
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USER}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD}
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - iot-network

  emqx2:
    image: emqx:5.8
    container_name: emqx2
    hostname: emqx2.iot-network
    restart: unless-stopped
    environment:
      - EMQX_NODE__NAME=emqx2@emqx2.iot-network
      - EMQX_NODE__COOKIE=${EMQX_NODE_COOKIE}
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_CLUSTER__STATIC__SEEDS=[emqx1@emqx1.iot-network,emqx2@emqx2.iot-network,emqx3@emqx3.iot-network]
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USER}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD}
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - iot-network

  emqx3:
    image: emqx:5.8
    container_name: emqx3
    hostname: emqx3.iot-network
    restart: unless-stopped
    environment:
      - EMQX_NODE__NAME=emqx3@emqx3.iot-network
      - EMQX_NODE__COOKIE=${EMQX_NODE_COOKIE}
      - EMQX_CLUSTER__DISCOVERY_STRATEGY=static
      - EMQX_CLUSTER__STATIC__SEEDS=[emqx1@emqx1.iot-network,emqx2@emqx2.iot-network,emqx3@emqx3.iot-network]
      - EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USER}
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD}
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - iot-network


  # HAProxy Load Balancer - Node 1
  haproxy1:
    image: haproxy:2.8-alpine
    container_name: haproxy1
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      emqx1:
        condition: service_healthy
      emqx2:
        condition: service_healthy
      emqx3:
        condition: service_healthy
    networks:
      iot-network:
        ipv4_address: 172.20.0.100
    logging: *default-logging

  # Keepalived failover manager for haproxy1
  keepalived1:
    image: osixia/keepalived:2.0.20
    container_name: keepalived1
    network_mode: "service:haproxy1"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BROADCAST
    environment:
      - KEEPALIVED_INTERFACE=eth0
      - KEEPALIVED_VIRTUAL_IPS=172.20.0.10
      - KEEPALIVED_UNICAST_PEERS=#PYTHON2BASH:['172.20.0.101']
      - KEEPALIVED_STATE=MASTER
      - KEEPALIVED_PRIORITY=101
      - KEEPALIVED_ROUTER_ID=51
    depends_on:
      - haproxy1
    restart: unless-stopped

  # HAProxy Load Balancer - Node 2
  haproxy2:
    image: haproxy:2.8-alpine
    container_name: haproxy2
    restart: unless-stopped
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      emqx1:
        condition: service_healthy
      emqx2:
        condition: service_healthy
      emqx3:
        condition: service_healthy
    networks:
      iot-network:
        ipv4_address: 172.20.0.101
    logging: *default-logging

  # Keepalived failover manager for haproxy2
  keepalived2:
    image: osixia/keepalived:2.0.20
    container_name: keepalived2
    network_mode: "service:haproxy2"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BROADCAST
    environment:
      - KEEPALIVED_INTERFACE=eth0
      - KEEPALIVED_VIRTUAL_IPS=172.20.0.10
      - KEEPALIVED_UNICAST_PEERS=#PYTHON2BASH:['172.20.0.100']
      - KEEPALIVED_STATE=BACKUP
      - KEEPALIVED_PRIORITY=100
      - KEEPALIVED_ROUTER_ID=51
    depends_on:
      - haproxy2
    restart: unless-stopped

  # Containerized FastAPI Application Ingestion/Worker pipeline
  fastapi:
    build: .
    container_name: fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=172.20.0.10
      - MQTT_PORT=1883
      - REDIS_URL=redis://:${REDIS_PASSWORD}@washroom-redis:6379/0
      - POSTGRES_URL=postgresql+asyncpg://postgres:postgres@washroom-timescaledb:5432/washroom_db
      - RATE_LIMIT_MESSAGES=10
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      keepalived1:
        condition: service_started
      keepalived2:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - iot-network

  # Redis for Token Buckets & Incident State Machine
  redis:
    image: redis:7.2-alpine
    container_name: washroom-redis
    restart: unless-stopped
    # Scalability: We enable basic persistence (RDB). To scale, we can easily 
    # replace this with Redis Sentinel or Redis Cluster.
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - iot-network


  # PostgreSQL + TimescaleDB for Telemetry Analytics
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: washroom-timescaledb
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=washroom_db
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      # Maps initialization scripts to create extensions and tables
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - iot-network


volumes:
  redis_data:
  timescaledb_data:

networks:
  iot-network:
    name: iot-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          ip_range: 172.20.0.128/25
          gateway: 172.20.0.1

